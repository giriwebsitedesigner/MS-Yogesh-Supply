<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M S Yogesh Supply – Invoice Generator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f3f1;--card:#fff;--tx:#18181b;--mu:#71717a;--bd:#e4e4e7;--ac:#f26a0c;--in:#fafafa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111113;--card:#1b1b1f;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2e2e34;--in:#141417}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111113;--card:#1b1b1f;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2e2e34;--in:#141417}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top img{height:38px}.top b{font-size:15px}.top span{color:var(--mu);font-size:12px;display:block}
.sp{flex:1}
.wrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;padding:18px;max-width:1300px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
textarea{resize:vertical;min-height:54px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;position:relative}
.item .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}.party-label{color:#52525b;font-weight:600}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 13px inherit;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn:hover{filter:brightness(.96)}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--tx);font-size:13px}.chk input{width:auto}
.stage{overflow:auto;display:flex;justify-content:center;align-items:flex-start}
#fit{transform-origin:top left}
/* ===== Invoice paper ===== */
#invoice{width:794px;height:1120px;overflow:hidden;background:#fff;color:#1e293b;padding:40px 42px 28px;font:13px/1.5 Inter,"Segoe UI",Arial,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
#invoice *{color:inherit}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.hl{min-width:0;flex:1}
.co h1{margin:0 0 6px;font-size:22px;font-weight:750;color:#111c33!important;letter-spacing:.01em}
.co div{font-size:12px;color:#475569!important;line-height:1.55}.co div+div{margin-top:5px}.co b{color:#334155!important}
.hr{width:238px;flex:none;text-align:right}.invoice-logo{width:110px;height:72px;object-fit:contain;display:block;margin:0 0 3px auto}.hr h2{margin:0 0 6px;font-size:23px;letter-spacing:.12em;font-weight:800;color:#111c33!important}
.hr .m{font-size:12px;font-weight:600;color:#1e293b!important;line-height:1.7}.hr .m b{color:#0f172a!important}
.line{height:3px;background:#f97316;margin:14px 0 18px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:0 0 auto;margin-bottom:20px;border:1.5px solid #334155;border-radius:8px;overflow:hidden}
.bx{padding:13px 15px;min-height:132px}.bx+.bx{border-left:1.5px solid #334155}.bx .ad{font-size:12.5px;line-height:1.5;color:#64748b!important}.bx .gs{font-size:12.5px}
.bx h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ea580c!important}
.bx .nm{font-size:14px;font-weight:700;color:#111c33!important;margin-bottom:3px}.bx div{font-size:12.5px;color:#64748b!important}.bx .site{margin-top:7px;color:#475569!important;font-weight:400}.bx .site b{color:#111c33!important;font-weight:700}.bx .site span{margin-left:4px;color:#475569!important;font-weight:400}.bx .gs{margin-top:5px;color:#475569!important}.bx .gs b{color:#111c33!important}
table.it{width:100%;border-collapse:collapse;border:1.5px solid #526273}
.it th{padding:9px 6px;background:#edf1f5;color:#26364a!important;font-size:12.5px;font-weight:800;text-align:center;border:1.5px solid #526273}
.it td{padding:var(--rp,11px) 8px;border:1.5px solid #526273;vertical-align:middle;font-size:var(--fs,13px);font-weight:500}
.it .r{text-align:right;white-space:nowrap}.it .c{text-align:center}.it .date{white-space:nowrap;text-align:center}
.it td.aw{vertical-align:top;padding:12px 14px}
.aw small{display:block;font-size:11px;letter-spacing:.14em;font-weight:800;color:#ea580c!important;margin-bottom:8px}
.aw p{margin:0;font-weight:800;font-size:15px;line-height:1.55;color:#111c33!important}
.it td.lb{font-weight:800;color:#111c33!important}
.it tr.gt td{background:#f1f5f9;font-weight:800;font-size:15px;color:#111c33!important}
.lv1{--rp:8px;--fs:12.5px;padding:34px 48px 26px!important}.lv1 .invoice-logo{width:102px;height:68px}.lv1 .line{margin:14px 0 16px}.lv1 .bs{margin-bottom:16px}.lv1 .bx{min-height:84px;padding:10px 14px}.lv1 .sg .sl{height:60px}.lv1 .ft{margin-top:22px}.lv1 .note{margin-top:14px}
.lv2{--rp:5px;--fs:12px;padding:26px 44px 20px!important}.lv2 .invoice-logo{width:92px;height:62px}.lv2 .line{margin:10px 0 12px}.lv2 .bs{margin-bottom:12px;gap:0}.lv2 .bx{min-height:0;padding:8px 12px}.lv2 .bx h4{margin-bottom:4px}.lv2 .sg .sl{height:48px}.lv2 .ft{margin-top:14px;padding-top:12px}.lv2 .note{margin-top:10px;padding-top:8px}.lv2 .it th{padding:6px}.lv2 .hr h2{font-size:21px}.lv2 .it td.aw{padding:8px 12px}
.lv3{--rp:3px;--fs:11.5px;padding:22px 40px 16px!important}.lv3 .invoice-logo{width:82px;height:56px}.lv3 .line{margin:8px 0 10px}.lv3 .bs{margin-bottom:10px;gap:0}.lv3 .bx{min-height:0;padding:6px 10px}.lv3 .bx h4{margin-bottom:3px}.lv3 .sg .sl{height:40px}.lv3 .ft{margin-top:10px;padding-top:10px}.lv3 .note{margin-top:8px;padding-top:6px}.lv3 .it th{padding:5px}.lv3 .hr h2{font-size:19px;margin-bottom:4px}.lv3 .co div{font-size:11px}.lv3 .it td.aw{padding:6px 10px}
.lv4{--rp:2px;--fs:11px;padding:18px 36px 12px!important}.lv4 .invoice-logo{width:72px;height:48px}.lv4 .bk div{line-height:1.5}.lv4 .co div+div{margin-top:2px}.lv4 .sg .sl{height:34px}
.sp2{flex:1}
.ft{display:grid;grid-template-columns:1fr 250px;gap:24px;border-top:1.5px solid #334155;padding-top:20px;margin-top:40px}
.bk h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:#ea580c!important}.bk div{font-size:13px;line-height:1.85}.bk b{color:#334155!important}
.sg{display:flex;flex-direction:column;text-align:center}.sg .sl{height:84px}
.sg i{font-style:normal;border-top:1px solid #94a3b8;padding-top:6px;font-size:12px;color:#475569!important}.sg b{font-size:12.5px;color:#111c33!important;margin-top:4px}
.note{text-align:center;font-size:11px;font-weight:700;color:#334155!important;margin-top:22px;padding-top:14px;border-top:1.5px solid #334155}
body.view .edit{display:none}body.view .wrap{display:block;max-width:860px}
.vbar{display:none;padding:12px 18px;gap:10px;justify-content:center}body.view .vbar{display:flex}
.hide{display:none}
.tabs{display:none;gap:0;padding:8px 14px 0}.tabs button{flex:1;padding:10px;border:0;border-bottom:3px solid var(--bd);background:none;color:var(--mu);font:600 14px inherit}.tabs button.on{color:var(--ac);border-color:var(--ac)}
@media(max-width:900px){.tabs{display:flex}body:not(.pv):not(.view) .stage{position:absolute;left:-9999px;top:0;width:794px;overflow:visible}body.pv .ec{display:none}.wrap{padding:12px}.top .btn{padding:8px 10px;font-size:12px}.top span{display:none}input,select,textarea{font-size:16px}.top{padding:10px 12px}}
</style></head><body>

 if(c)p.push(three(c)+' Crore');if(l)p.push(two(l)+' Lakh');if(t)p.push(two(t)+' Thousand');if(r)p.push((p.length&&r<100?'And ':'')+three(r));return p.join(' ')}
function inrWords(x){x=Math.round(x*100);const R=Math.floor(x/100),P=x%100;let s=words(R)+' Rupees';if(P)s+=' And '+two(P)+' Paise';return s+' Only.'}
const today=()=>new Date().toISOString().slice(0,10);
const dmy=d=>d?d.split('-').reverse().join('-'):'';
const blank=()=>({supplyDate:today(),desc:'',hsn:'',qty:1,unit:'Day',qtyUnit:'MT',customUnit:'',rate:0});
let S={no:'',serialNo:'',date:today(),b:{n:'',site:'',a:'',g:''},same:false,s:{n:'',site:'',a:'',g:''},items:[blank()],cg:9,sg:9};
const BANK=[['Bank','INDIAN BANK'],['Branch','VALARPURAM'],['A/C No','807860551'],['IFSC','IDIB000V060']];
const HSN_NAMES={2517:'M-Sand',2523:'Cement',6904:'Bricks',7214:'TMT Steel',9966:'Tipper',9973:'Excavator'};
const viewMode=/[#&]v=/.test(location.hash);
function enc(){const o={n:S.no,x:S.serialNo,d:S.date,b:[S.b.n,S.b.a,S.b.g,S.b.site],s:S.same?0:[S.s.n,S.s.a,S.s.g,S.s.site],i:S.items.map(i=>[i.desc,i.hsn,i.qty,i.unit,i.rate,i.qtyUnit,i.supplyDate,i.customUnit]),c:S.cg,g:S.sg};
 return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(h){h=h.replace(/-/g,'+').replace(/_/g,'/');const o=JSON.parse(decodeURIComponent(escape(atob(h))));
 return{no:o.n||'',serialNo:o.x||'',date:o.d,b:{n:o.b[0],a:o.b[1],g:o.b[2],site:o.b[3]||''},same:!o.s,s:o.s?{n:o.s[0],a:o.s[1],g:o.s[2],site:o.s[3]||''}:{n:'',site:'',a:'',g:''},items:o.i.map(a=>({desc:a[0],hsn:a[1],qty:a[2],unit:a[3]==='Self Enterable'?'Qty':a[3],rate:a[4],qtyUnit:a[3]==='Self Enterable'?'Custom':(a[5]||'MT'),supplyDate:a[6]||o.d||'',customUnit:a[7]||''})),cg:o.c,sg:o.g}}
function itemUnit(i){if(i.unit==='Qty')return i.qtyUnit==='Custom'?(i.customUnit||'Unit'):(i.qtyUnit||'MT');return i.unit==='Days'?'Day':i.unit}
function rateUnit(i){return itemUnit(i)==='Hours'?'Hour':itemUnit(i)}
function tableUnit(i){return i.unit==='Days'?'Day':i.unit}
function hsnName(hsn){return HSN_NAMES[String(hsn).trim()]||''}
function party(t,p){return`<div class="bx"><h4>${t}</h4><div class="nm">${esc(p.n)||'&nbsp;'}</div><div class="ad">${nl(p.a)}</div>${p.g?`<div class="gs"><b>GSTIN:</b> ${esc(p.g)}</div>`:''}${p.site?`<div class="site"><b>Site Name:</b><span>${esc(p.site)}</span></div>`:''}</div>`}
function render(){
 const units=[...new Set(S.items.map(tableUnit))];const u=units.length===1?units[0]:null;
 const hq=u?`No. ${u}`:'Qty';
 let sub=0;const rows=S.items.map((i,k)=>{const a=Math.round((+i.qty||0)*(+i.rate||0)*100)/100;sub+=a;
  return`<tr><td class="c">${k+1}</td><td class="date">${dmy(i.supplyDate)}</td><td class="c">${nl(i.desc)}</td><td class="c">${esc(i.hsn)}</td><td class="c">${+i.qty||0} ${itemUnit(i)}</td><td class="r">${fmt(+i.rate||0)}</td><td class="r">${fmt(a)}</td></tr>`}).join('');
 const c=Math.round(sub*S.cg)/100,g=Math.round(sub*S.sg)/100,gt=Math.round((sub+c+g)*100)/100,sh=S.same?S.b:S.s;
 $('invoice').innerHTML=`<div class="hd"><div class="hl"><div class="co"><h1>M S YOGESH SUPPLY</h1><div>No.56, Bharathidasan street,<br>Valarpuram Village,<br>Kancheepuram District-602605.</div><div><b>GSTIN:</b> 33BYKPS9635L2ZL<br><b>Mobile:</b> 8883226008<br><b>Email:</b> yogeshram1969@gmail.com</div></div></div>
 <div class="hr"><img class="invoice-logo" src="${LOGO}" alt="M S Yogesh Supply logo"><h2>TAX INVOICE</h2><div class="m">${S.no?`<b>INVOICE NO:</b> ${esc(S.no)}<br>`:''}${S.serialNo?`<b>SERIAL NO:</b> ${esc(S.serialNo)}<br>`:''}<b>DATE:</b> ${dmy(S.date)}</div></div></div>
 <div class="line"></div>
 <div class="bs">${party('Bill To',S.b)}${party('Ship To',sh)}</div>
 <table class="it"><thead><tr><th style="width:42px">S.No.</th><th style="width:75px">Supply Date</th><th>Particulars</th><th style="width:72px">HSN/SAC</th><th style="width:74px">${hq}</th><th style="width:90px">Rate per (₹)</th><th style="width:94px">Amount (₹)</th></tr></thead><tbody>${rows}<tr><td class="aw" colspan="4" rowspan="4"><small>AMOUNT IN WORDS</small><p>${inrWords(gt)}</p></td><td class="lb" colspan="2">TOTAL</td><td class="r">₹${fmt(sub)}</td></tr><tr><td class="lb" colspan="2">ADD. CGST ${S.cg}%</td><td class="r">₹${fmt(c)}</td></tr><tr><td class="lb" colspan="2">ADD. SGST ${S.sg}%</td><td class="r">₹${fmt(g)}</td></tr><tr class="gt"><td colspan="2">GRAND TOTAL</td><td class="r">₹${fmt(gt)}</td></tr></tbody></table>
 <div class="sp2"></div>
 <div class="ft"><div class="bk"><h4>ACCOUNT DETAILS</h4>${BANK.map(r=>`<div><b>${r[0]}:</b> ${r[1]}</div>`).join('')}</div>
 <div class="sg"><div class="sl"></div><i>Authorized Signature / Seal</i><b>For M S YOGESH SUPPLY</b></div></div>
 <div class="note">Thank you for your business.</div>`;
 const inv=$('invoice');let L=0;inv.className='lv0';while(inv.scrollHeight>inv.clientHeight+1&&L<4){L++;inv.className='lv'+L}
 fit();
}
function fit(){const w=$('stage').clientWidth||800,k=Math.min(1,(w-4)/794),f=$('fit');f.style.transform=`scale(${k})`;f.style.height=($('invoice').offsetHeight*k)+'px';f.style.width=(794*k)+'px'}
addEventListener('resize',fit);
function pdf(){const f=$('fit'),t=f.style.transform;f.style.transform='none';const inv=$('invoice');inv.style.boxShadow='none';
 html2pdf().set({margin:0,filename:`Invoice-${(S.no||'').replace(/[^\w-]/g,'')}-M-S-Yogesh-Supply.pdf`,image:{type:'jpeg',quality:.86},html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0,logging:false},jsPDF:{unit:'px',format:[794,1120],hotfixes:['px_scaling'],compress:true}}).from(inv).save().then(()=>{inv.style.boxShadow='';f.style.transform=t;fit()})}
function edItems(){$('items').innerHTML=S.items.map((it,k)=>{const qty=it.unit==='Qty',custom=qty&&it.qtyUnit==='Custom';return`<div class="item">${S.items.length>1?`<button class="x" data-k="${k}">×</button>`:''}
 <div class="r2"><div><label>Supply Date</label><input type="date" data-k="${k}" data-f="supplyDate" value="${esc(it.supplyDate)}"></div><div><label>Particulars</label><input data-k="${k}" data-f="desc" value="${esc(it.desc)}"></div></div>
 <div class="r2"><div><label>HSN/SAC</label><input list="hsn-options" data-k="${k}" data-f="hsn" value="${esc(it.hsn)}" placeholder="Choose or enter code"></div><div><label>Unit Type</label><select data-k="${k}" data-f="unit"><option value="Day" ${itemUnit(it)==='Day'?'selected':''}>Day</option><option value="Hours" ${it.unit==='Hours'?'selected':''}>Hours</option><option value="Qty" ${qty?'selected':''}>Qty</option><option value="Trip" ${it.unit==='Trip'?'selected':''}>Trip</option><option value="Load" ${it.unit==='Load'?'selected':''}>Load</option></select></div></div>
 ${qty?`<label>Qty Unit</label><select data-k="${k}" data-f="qtyUnit"><option value="MT" ${it.qtyUnit==='MT'?'selected':''}>MT</option><option value="Unit" ${it.qtyUnit==='Unit'?'selected':''}>Unit</option><option value="CFT" ${it.qtyUnit==='CFT'?'selected':''}>CFT</option><option value="Custom" ${it.qtyUnit==='Custom'?'selected':''}>Custom</option></select>`:''}
 ${custom?`<label>Custom Qty Unit</label><input data-k="${k}" data-f="customUnit" value="${esc(it.customUnit)}" placeholder="e.g. Bag, Litre, Km">`:''}
 <div class="r2"><div><label>${qty?'No. Qty':`No. of ${itemUnit(it)}`}</label><input type="number" min="0" step="any" data-k="${k}" data-f="qty" value="${it.qty}"></div><div><label>Rate per (₹)</label><input type="number" min="0" step="any" data-k="${k}" data-f="rate" value="${it.rate}"></div></div></div>`}).join('')}
function fill(){$('no').value=S.no;$('serialNo').value=S.serialNo;$('dt').value=S.date;$('bn').value=S.b.n;$('bs').value=S.b.site;$('ba').value=S.b.a;$('bg').value=S.b.g;$('same').checked=S.same;$('shipf').classList.toggle('hide',S.same);
 $('sn').value=S.s.n;$('ss').value=S.s.site;$('sa').value=S.s.a;$('sg').value=S.s.g;$('cg').value=S.cg;$('sgs').value=S.sg;edItems()}
function bind(){
 const m={no:v=>S.no=v,serialNo:v=>S.serialNo=v,dt:v=>S.date=v,bn:v=>S.b.n=v,bs:v=>S.b.site=v,ba:v=>S.b.a=v,bg:v=>S.b.g=v.toUpperCase(),sn:v=>S.s.n=v,ss:v=>S.s.site=v,sa:v=>S.s.a=v,sg:v=>S.s.g=v.toUpperCase()};
 for(const id in m)$(id).addEventListener('input',e=>{m[id](e.target.value);render()});
 $('same').onchange=e=>{S.same=e.target.checked;$('shipf').classList.toggle('hide',S.same);render()};
 $('cg').onchange=e=>{S.cg=+e.target.value;S.sg=S.cg;$('sgs').value=S.sg;render()};
 $('sgs').onchange=e=>{S.sg=+e.target.value;render()};
 $('items').addEventListener('input',e=>{const d=e.target.dataset;if(!d.f)return;S.items[d.k][d.f]=e.target.value;render()});
 $('items').addEventListener('change',e=>{const d=e.target.dataset;if(d.f==='hsn'){const n=hsnName(S.items[d.k].hsn);if(n)S.items[d.k].desc=n}if(['unit','qtyUnit','hsn'].includes(d.f)){edItems();render()}});
 $('items').addEventListener('click',e=>{if(e.target.dataset.k&&e.target.className==='x'){S.items.splice(+e.target.dataset.k,1);edItems();render()}});
 $('add').onclick=()=>{S.items.push(blank());edItems();render()};
 $('rst').onclick=()=>{S={no:'',serialNo:'',date:today(),b:{n:'',site:'',a:'',g:''},same:false,s:{n:'',site:'',a:'',g:''},items:[blank()],cg:9,sg:9};fill();render()};
}
$('t1').onclick=()=>{document.body.classList.remove('pv');$('t1').className='on';$('t2').className='';scrollTo(0,0)};
$('t2').onclick=()=>{document.body.classList.add('pv');$('t2').className='on';$('t1').className='';fit();scrollTo(0,0)};
$('pdf1').onclick=$('pdf2').onclick=pdf;
if(viewMode){try{S=dec(location.hash.split('v=')[1]);document.body.classList.add('view');$('pdf1').classList.add('hide');$('rst').classList.add('hide')}catch(e){}}
else{bind();fill()}
addEventListener('hashchange',()=>location.reload());
window.addEventListener('load',()=>render());
render();
</script></body></html>
